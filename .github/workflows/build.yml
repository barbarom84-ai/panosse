name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Panosse.slnx

    - name: Publish WinUI portable single-file
      run: |
        dotnet publish src/Panosse.WinUI/Panosse.WinUI.csproj `
          -c Release `
          -r win-x64 `
          -p:Platform=x64 `
          -p:SelfContained=true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:WindowsAppSDKSelfContained=true `
          -p:IncludeAllContentForSelfExtract=true `
          -p:PublishTrimmed=false `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          -o publish

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Build installer
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $iscc = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
          "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
        ) | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $iscc) { throw "ISCC.exe introuvable" }
        & $iscc "/DMyAppVersion=$version" "Panosse-Setup.iss"
        if ($LASTEXITCODE -ne 0) { throw "Compilation Inno Setup echouee" }

    - name: Rename executable
      run: |
        $version = "${{ github.ref_name }}"
        if (Test-Path "publish\Panosse.exe") {
          Move-Item -Path "publish\Panosse.exe" -Destination "publish\Panosse-$version.exe" -Force
        } else {
          throw "publish\Panosse.exe introuvable"
        }

    - name: Calculate SHA256
      id: checksum
      run: |
        $version = "${{ github.ref_name }}"
        $hash = (Get-FileHash -Path "publish\Panosse-$version.exe" -Algorithm SHA256).Hash
        echo "sha256=$hash" >> $env:GITHUB_OUTPUT
        echo "$hash  Panosse-$version.exe" > publish\SHA256SUMS.txt

    - name: Generate release notes
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        $body = @"
        ## Panosse $version (WinUI 3)

        La serpillère numérique pour un PC tout propre.

        ### Installation

        - **Portable** : téléchargez ``Panosse-$version.exe`` et lancez-le (aucune installation).
        - **Installateur** : utilisez ``Panosse-Setup-$version.exe`` pour une installation classique dans Program Files.

        Les mises à jour depuis l'application vérifient l'intégrité via SHA256.

        ### Fonctionnalités

        - Nettoyage complet (temp, caches, corbeille, registre)
        - Mode prévisualisation et exclusions intelligentes
        - Historique des opérations et planification
        - Mises à jour automatiques
        - Raccourci global Ctrl+Alt+P et icône barre des tâches

        ### Prérequis

        - Windows 10/11 (x64)
        - Droits administrateur pour certaines opérations

        ### Checksum SHA256 (portable)

        ``````
        ${{ steps.checksum.outputs.sha256 }}
        ``````
        "@
        Set-Content -Path "publish\RELEASE_NOTES.md" -Value $body -Encoding utf8

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Panosse ${{ github.ref_name }}
        body_path: publish/RELEASE_NOTES.md
        files: |
          publish/Panosse-${{ github.ref_name }}.exe
          publish/SHA256SUMS.txt
          installer/Panosse-Setup-${{ github.ref_name }}.exe
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
