name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Panosse.slnx

    - name: Publish WinUI portable single-file
      run: |
        dotnet publish src/Panosse.WinUI/Panosse.WinUI.csproj `
          -c Release `
          -r win-x64 `
          -p:Platform=x64 `
          -p:SelfContained=true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:WindowsAppSDKSelfContained=true `
          -p:IncludeAllContentForSelfExtract=true `
          -p:PublishTrimmed=false `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          -o publish

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Build installer
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $iscc = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
          "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
        ) | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $iscc) { throw "ISCC.exe introuvable" }
        & $iscc "/DMyAppVersion=$version" "Panosse-Setup.iss"
        if ($LASTEXITCODE -ne 0) { throw "Compilation Inno Setup echouee" }

    - name: Package portable artifacts
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        if (-not (Test-Path "publish\Panosse.exe")) {
          throw "publish\Panosse.exe introuvable"
        }
        # WinUI single-file MUST keep the assembly name (Panosse.exe).
        # Renaming the exe breaks Microsoft.UI.Xaml resource loading (0xC000027B).
        Compress-Archive -Path "publish\Panosse.exe" -DestinationPath "publish\Panosse-$tag-portable.zip" -Force

    - name: Calculate SHA256
      id: checksum
      shell: pwsh
      run: |
        $hash = (Get-FileHash -Path "publish\Panosse.exe" -Algorithm SHA256).Hash
        echo "sha256=$hash" >> $env:GITHUB_OUTPUT
        Set-Content -Path "publish\SHA256SUMS.txt" -Value "$hash  Panosse.exe" -Encoding ascii

    - name: Generate release notes
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        $body = @"
        ## Panosse $version (WinUI 3)

        La serpillère numérique pour un PC tout propre.

        ### Installation

        - **Portable** : téléchargez ``Panosse-$version-portable.zip``, extrayez puis lancez ``Panosse.exe`` (ne renommez pas le fichier).
        - **Installateur** : utilisez ``Panosse-Setup-$version.exe`` pour une installation dans Program Files.

        Les mises à jour depuis l'application vérifient l'intégrité via SHA256.

        ### Correctifs

        - Fermeture Edge/Chrome plus fiable (plus de freeze UI / WebView2)
        - Portable WinUI : l'exécutable doit rester nommé ``Panosse.exe``

        ### Fonctionnalités

        - Nettoyage complet (temp, caches, corbeille, registre)
        - Mode prévisualisation et exclusions intelligentes
        - Historique des opérations et planification
        - Mises à jour automatiques
        - Raccourci global Ctrl+Alt+P et icône barre des tâches

        ### Prérequis

        - Windows 10/11 (x64)
        - Droits administrateur pour certaines opérations

        ### Checksum SHA256 (``Panosse.exe``)

        ``````
        ${{ steps.checksum.outputs.sha256 }}
        ``````
        "@
        Set-Content -Path "publish\RELEASE_NOTES.md" -Value $body -Encoding utf8

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Panosse ${{ github.ref_name }}
        body_path: publish/RELEASE_NOTES.md
        files: |
          publish/Panosse.exe
          publish/Panosse-${{ github.ref_name }}-portable.zip
          publish/SHA256SUMS.txt
          installer/Panosse-Setup-${{ github.ref_name }}.exe
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
